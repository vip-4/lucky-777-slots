    <rect x="0" y="0" width="350" height="330" rx="26" fill="#0a1024" stroke="url(#gold)" stroke-opacity="0.5" stroke-width="2"/>
    <g transform="translate(22, 24)">
      <rect x="0"   y="0" width="96" height="130" rx="12" fill="#fdfbf4"/>
      <rect x="108" y="0" width="96" height="130" rx="12" fill="#fdfbf4"/>
      <rect x="216" y="0" width="96" height="130" rx="12" fill="#fdfbf4"/>
      <text x="48"  y="86" font-size="60" text-anchor="middle">🍒</text>
      <text x="156" y="86" font-size="60" text-anchor="middle">7️⃣</text>
      <text x="264" y="86" font-size="60" text-anchor="middle">💎</text>
