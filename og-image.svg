  <text x="92" y="250" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="76" font-weight="900" fill="#ffffff">LUCKY <tspan fill="url(#gold)">777</tspan></text>
  <text x="96" y="320" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="38" font-weight="600" fill="#ffe6a3">輕量級 HTML5 老虎機示範</text>
  <text x="96" y="382" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="23" fill="#9aa6c4">零依賴 · 純前端 · SEO／GEO 就緒 · 一鍵靜態部署</text>

  <g font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="21" fill="#c9d3ee">
