<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080c18"/>
      <stop offset="0.55" stop-color="#111830"/>
      <stop offset="1" stop-color="#080c18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe6a3"/>
      <stop offset="0.5" stop-color="#f5c451"/>
      <stop offset="1" stop-color="#c8912b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#f5c451" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f5c451" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- 外框 -->
  <rect x="26" y="26" width="1148" height="578" rx="28" fill="none" stroke="url(#gold)" stroke-opacity="0.45" stroke-width="2"/>

